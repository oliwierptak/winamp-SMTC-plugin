name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.8.1

      - name: Build release
        run: msbuild WinampSMTC.sln /m /p:Configuration=Release /p:Platform=x86

      - name: Copy DLL artifact
        shell: pwsh
        run: |
          $artifactDirectory = Join-Path $env:RUNNER_TEMP 'winamp-smtc'
          New-Item -ItemType Directory -Force -Path $artifactDirectory | Out-Null
          Copy-Item 'bin\Release\gen_winsmtc.dll' $artifactDirectory

      - name: Generate SHA256
        shell: pwsh
        run: |
          $dllPath = Join-Path $env:RUNNER_TEMP 'winamp-smtc\gen_winsmtc.dll'
          $hash = (Get-FileHash $dllPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  gen_winsmtc.dll" | Set-Content (Join-Path $env:RUNNER_TEMP 'winamp-smtc\gen_winsmtc.dll.sha256') -NoNewline

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ runner.temp }}/winamp-smtc/gen_winsmtc.dll
            ${{ runner.temp }}/winamp-smtc/gen_winsmtc.dll.sha256
          generate_release_notes: true